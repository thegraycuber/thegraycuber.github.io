			<h2>into the math</h2>
			<p>As a quick recap of base systems, let's take a look at our typical system - base 10.
				To find the value of a number, we can first split the digits apart:
			</p>
			<p style="text-align: center;">1234 = 1000 + 200 + 30 + 4</p>
			<p>Each of these components is the product of a single digit and a power of the base, determined by the number of zeroes:
			</p>
			<p style="text-align: center;">1000 = 1 * 10³</p>
			<p style="text-align: center;">200 = 2 * 10²</p>
			<p>This idea can be applied to other natural bases, such as base 2, or base 12, but what if we make the base imaginary?
			</p>
			<h2>base i</h2>
			<p>Let's replace our base 10 with imaginary number i, which has the property i² = -1. We can calculate the value 1234 as follows:
			</p>
			<p style="text-align: center;">1234 = 1000 + 200 + 30 + 4</p>
			<p style="text-align: center;">= 1 * i³  +  2 * i²  +  3 * i  +  4</p>
			<p style="text-align: center;">= -i - 2 + 3i + 4</p>
			<p style="text-align: center;">= 2i + 2</p>
			<p>This base technically works, but it has the problem of duplicates:
			</p>
			<p style="text-align: center;">10000 = 1 * i⁴ = (i²)² = (-1)² = 1</p>
			<p>There are multiple ways to write 1. A well-behaved base system should have a unique representation for each number.
				Instead we can use base -1+i, which does represent each value uniquely. Paste the following code to see the base:
			</p>		
			<p style="text-align: center;">base -1+i with digits 0, and 1</p>

			<h2>base ω-1</h2>
			<p>Instead of the imaginary unit, which produce a square grid, we can create a hexagonal grid by using ω (omega).
				It can be defined using either of the following equations. 
				As an exercise, show that the second implies the first.
			</p>
			<p style="text-align: center;">ω² = -ω-1</p>
			<p style="text-align: center;">ω = (√3i-1)/2</p>
			<p>Just like i, ω does not work well as a base. However, ω-1 works quite well. Use the following code to check it out:
			</p>
			<p style="text-align: center;">base -1+ω with digits 0, 1, and 1+ω</p>
			
			<h2>about me</h2>
			<p>I am TheGrayCuber, a creator of mathematical websites and videos
			</p>
			
			<p>This is the first project that I've made since my transition to this new website framework.
				I welcome suggestions for improvements, so let me know what you think!
			</p>
			
			<p>My intent behind this page is to offer you a method to easily explore imaginary bases -
				quickly making adjustments with live feedback - so that you can get the feeling of these 
				systems without worrying about the mathematical details going on behind the scenes.
			</p>
			
			<p>This reflects my ongoing shift in focus to the experience that we get by engaging with mathematics,
				as opposed to the precision that we get by doing it 'correctly'. 
				Of course, building models correctly often leads to positive experiences,
				but I think it's important to allow for messiness and mistakes, 
				because they too can provide interesting and novel insights. 
			</p>
			
			<p>Is it worthwhile for beings to spend their time solving dozens of exercises of the same form?
				Should I value a theory based on its applications, even though so many of those
